name: Build Faceless 2 v0.31 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/faceless2-rendering-polish

concurrency:
  group: backrooms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-license-check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Verify Sketchfab licensing importer without network or secrets
        run: |
          python -m unittest discover -s faceless2 -p 'test_fetch_sketchfab_cast.py' -v
          python -m unittest discover -s faceless2 -p 'test_fetch_real_backrooms_assets.py' -v

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified CC0 monster GLB
        shell: bash
        run: |
          # Stored as byte-range Git blobs to avoid per-request upload limits.
          # Concatenation reproduces the exact licensed FBX-converted GLB.
          cat faceless2/assets/entity.glb.part[0-9][0-9] > faceless2/assets/entity.glb
          echo "bf74395119a9c93aa13c46ec15d7facca2a314f9637e11de237a3bebb8ca9961  faceless2/assets/entity.glb" | sha256sum -c -
          test "$(git hash-object faceless2/assets/entity.glb)" = "f5e33713655ecc8e238451e556796a8791d73248"
          # Source: Huuxloc / BackRooms (CC BY 4.0), preserved bit-for-bit.
          test "$(git hash-object faceless2/assets/vendor/huuxloc_backroom.glb)" = "f7c83503ca46b6f9d6922337f3acc2dcef5ba76e"

      - name: Restore verified Godot base
        shell: bash
        run: |
          cat v03/chunk00.b64 v03/chunk01.b64 v03/chunk02.b64 v03/chunk03.b64 v03/chunk04.b64 v03/chunk05.b64 v03/chunk06.b64 > upgrade.b64
          base64 -d upgrade.b64 > upgrade.zip
          echo "054a7037bebddd6a4be9e697f495c5577756bc7b4c075681d2fb3226a74f65ea  upgrade.zip" | sha256sum -c -
          mkdir app
          unzip -q upgrade.zip -d app

      - name: Prepare Faceless 2 exploration and CC BY architecture
        shell: bash
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 fonttools==4.61.1 trimesh==4.7.4 numpy==2.2.6 cairosvg==2.8.2
          python - <<'PYCODE'
          from pathlib import Path
          from PIL import Image
          import shutil, re
          for folder in ['scripts', 'assets', 'audio']:
              root=Path('app', folder)
              root.mkdir(parents=True, exist_ok=True)
              for item in root.iterdir():
                  if item.is_file(): item.unlink()
          source=Path('faceless2')
          for name in ['backrooms.gd','backrooms_level.gd','backrooms_player.gd','backrooms_ui.gd','backrooms_network.gd','backrooms_rooms.gd','backrooms_assets.gd','backrooms_story.gd','backrooms_prologue.gd','backrooms_prologue_room.gd','backrooms_wakeup_room.gd','backrooms_extra_levels.gd','backrooms_extra_transport.gd','backrooms_fps_arena.gd','backrooms_fps.gd','backrooms_fps_checks.gd','backrooms_extra_levels_checks.gd','backrooms_prologue_checks.gd','backrooms_story_checks.gd','backrooms_checks.gd','backrooms_cinematic_checks.gd','backrooms_network_checks.gd','backrooms_room_checks.gd','backrooms_fps_session_checks.gd','virtual_joystick.gd','touch_action.gd']:
              shutil.copy2(source/name, Path('app/scripts')/name)
          shutil.copy2(source/'assets/entity.glb', 'app/assets/entity.glb')
          (Path('app/assets/vendor')).mkdir(parents=True, exist_ok=True)
          shutil.copy2(source/'assets/vendor/huuxloc_backroom.glb', 'app/assets/vendor/huuxloc_backroom.draco.glb')
          shutil.copy2(source/'ASSET_CREDITS.md', 'app/ASSET_CREDITS.md')
          shutil.copy2(source/'OFL.txt', 'app/OFL.txt')
          Path('app/main.tscn').write_text((source/'main.tscn').read_text().replace('res://faceless2/', 'res://scripts/'))
          shutil.copy2(source/'branding/game_icon.png', 'app/ui/game_icon.png')
          shutil.copy2(source/'branding/team_logo.jpg', 'app/ui/team_logo.jpg')
          Image.open('app/ui/team_logo.jpg').save('app/ui/team_splash.png')
          p=Path('app/project.godot'); s=p.read_text()
          s=re.sub(r'config/name=.*', 'config/name="Faceless 2"', s)
          s=re.sub(r'config/icon=.*', 'config/icon="res://ui/game_icon.png"', s)
          s=re.sub(r'boot_splash/image=.*', 'boot_splash/image="res://ui/team_splash.png"', s)
          s=re.sub(r'boot_splash/bg_color=.*', 'boot_splash/bg_color=Color(1, 1, 1, 1)', s)
          s=s.replace('boot_splash/fullsize=false','boot_splash/fullsize=true')
          # Keep Vulkan; avoid Godot 4.7's Swappy presentation hang (#121035).
          s=s.replace('[display]', '[display]\nwindow/frame_pacing/android/enable_frame_pacing=false', 1)
          s=re.sub(r'(?m)^worker_pool/(max_threads|low_priority_thread_ratio)=.*\n?', '', s)
          if '[threading]' not in s: s += '\n[threading]\n'
          s=s.replace('[threading]', '[threading]\nworker_pool/max_threads=8\nworker_pool/low_priority_thread_ratio=1.0', 1)
          p.write_text(s)
          p=Path('app/export_presets.cfg'); s=p.read_text()
          s=s.replace('Escape Black Pine','Faceless 2').replace('School Brawl','Faceless 2')
          s=s.replace('res://ui/icon.svg','res://ui/game_icon.png')
          s=re.sub(r'(?m)^version/code=.*','version/code=31',s)
          s=re.sub(r'(?m)^version/name=.*','version/name="0.31.0"',s)
          # Export all resources: scripts load imported GLBs, audio and textures by path.
          # A resource-only selection is unsafe for dynamic ResourceLoader paths.
          s=re.sub(r'(?m)^export_filter=.*', 'export_filter="all_resources"', s)
          s=re.sub(r'(?m)^include_filter=.*', 'include_filter="ASSET_CREDITS.md,OFL.txt,KOKORO_APACHE_2.txt"', s)
          s=re.sub(r'(?m)^exclude_filter=.*', 'exclude_filter=""', s)
          for setting in ['launcher_icons/main_192x192','launcher_icons/adaptive_foreground_432x432','launcher_icons/adaptive_background_432x432','splash_screen/icon']:
              s=re.sub(r'(?m)^'+re.escape(setting)+r'=.*', setting+'="res://ui/game_icon.png"', s)
          for architecture in ['arm64-v8a','x86_64']:
              s=re.sub(r'(?m)^architectures/'+architecture+'=.*', 'architectures/'+architecture+'=true', s)
          for name in ['internet','access_network_state']:
              field='permissions/'+name
              if re.search(r'(?m)^'+field+'=',s): s=re.sub(r'(?m)^'+field+'=.*', field+'=true',s)
              else: s += '\n'+field+'=true\n'
          p.write_text(s)
          PYCODE
          python faceless2/backrooms_audio.py app/audio
          python faceless2/fetch_backrooms_assets.py app/assets/vendor
          # Kenney-authored CC0 Food Kit and Mini Dungeon Kit, exact GLBs
          # included in repo with upstream SHA and credits.
          cp faceless2/assets/vendor/almond_water.glb app/assets/vendor/almond_water.glb
          cp faceless2/assets/vendor/lift_key.glb app/assets/vendor/lift_key.glb
          python faceless2/create_viewmodel.py app/assets/vendor/crew.glb app/assets/vendor/first_person_arms.glb --part arm
          python faceless2/create_viewmodel.py app/assets/vendor/crew.glb app/assets/vendor/first_person_legs.glb --part leg
          python faceless2/generate_sound.py app/audio
          python faceless2/fetch_wakeup_assets.py app/assets/vendor
          python faceless2/fetch_fps_assets.py app/assets/vendor
          python faceless2/fetch_flashlight.py app/assets/vendor app/ASSET_CREDITS.md qa/flashlight-assets.log
          python faceless2/fetch_sketchfab_cast.py app/assets/vendor
          python faceless2/bake_sketchfab_smiler.py app/assets/vendor/sketchfab_smiler.glb app/assets/vendor/sketchfab_smiler_face.png
          python faceless2/bake_online_frowner.py faceless2/assets/third_party/twemoji_2639.svg app/assets/vendor/frowner_online_ccby.png app/ASSET_CREDITS.md
          python faceless2/bake_laboratory_glb.py app/assets/vendor app/ASSET_CREDITS.md qa/laboratory-shell.json
          # v0.30 retired the old experimental lab; only keep the sourced corridor.
          rm app/assets/vendor/laboratory_shell_cc0.glb app/assets/vendor/observation_wing_cc0.glb
          python faceless2/fetch_real_backrooms_assets.py app/assets/vendor app/ASSET_CREDITS.md qa/real-backrooms-assets.json
          # First prefer the original API when token permits. A token may
          # exist but lack access; never block the legitimate public mirror.
          if [ -n "${SKETCHFAB_TOKEN:-}" ]; then
            python faceless2/fetch_sketchfab_phone.py app/assets/vendor || echo "SKETCHFAB_STATUS=authorized-download-unavailable; using verified CC BY public copy"
          fi
          if [ ! -s app/assets/vendor/iphone17_pro.glb ]; then
            curl --fail --location --silent --show-error --retry 3 \
              --output app/assets/vendor/iphone17_pro.glb \
              "https://raw.githubusercontent.com/quentin-pla/phone-mockup-studio/9908f2c321787779b6e028cba1ab67cd29a6a6dd/source/iphone_17_pro.glb"
            echo "31d6a04caabcca2fb717738079ca66da59347647" | grep -Fx "$(git hash-object app/assets/vendor/iphone17_pro.glb)"
            test "$(stat -c%s app/assets/vendor/iphone17_pro.glb)" = "24368404"
            test "$(head -c 4 app/assets/vendor/iphone17_pro.glb)" = "glTF"
            echo "SKETCHFAB_STATUS=verified-iphone17pro-CC-BY-4.0"
          fi
          npx --yes @gltf-transform/cli@4.5.1 cp app/assets/vendor/huuxloc_backroom.draco.glb app/assets/vendor/huuxloc_backroom.glb
          test -s app/assets/vendor/huuxloc_backroom.glb
          rm app/assets/vendor/huuxloc_backroom.draco.glb
          mkdir -p qa
          printf '%s\n' "$GITHUB_SHA" > qa/commit-sha.txt

      - name: Test JavaScript room directory without external services
        shell: bash
        run: |
          node --test matchmaking/server.test.mjs
      - name: Generate licensed offline Mandarin neural TTS (no system TTS, no fal)
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq espeak-ng ffmpeg
          python -m pip install --disable-pip-version-check "torch==2.5.1+cpu" --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check "kokoro==0.9.4" "misaki[zh]==0.9.4" "soundfile>=0.12" "transformers==4.45.2"
          echo "Kokoro CPU voice generation started" > qa/tts-status.log
          export OMP_NUM_THREADS=2 MKL_NUM_THREADS=2 HF_HUB_DISABLE_XET=1
          python faceless2/generate_voice.py app/audio/voice | tee qa/neural-voice-generation.log
          cp /usr/share/common-licenses/Apache-2.0 app/KOKORO_APACHE_2.txt
          test "$(find app/audio/voice -maxdepth 1 -name '*.ogg' | wc -l)" = 25

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS

      - name: Import and test real gameplay and P2P sessions
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path app --import
          python - <<'PYCODE'
          from pathlib import Path
          root=Path('app')
          required=['assets/entity.glb','assets/vendor/almond_water.glb','assets/vendor/lift_key.glb','assets/vendor/huuxloc_backroom.glb','assets/vendor/story_font.otf','assets/vendor/crew.glb','assets/vendor/first_person_arms.glb','assets/vendor/first_person_legs.glb','audio/voice/brief_0.ogg','audio/voice/brief_3.ogg','audio/voice/opening.ogg','audio/voice/tape_3_2.ogg','audio/voice/turn_2.ogg','audio/voice/ending_seal.ogg','audio/voice/tape_2_2.ogg','audio/splash.wav','audio/elevator_door.wav','audio/elevator_move.wav','audio/phone_ring.wav','audio/phone_disconnect.wav','audio/phone_static.wav','audio/phone_fall.wav','assets/vendor/iphone17_pro.glb','assets/vendor/sketchfab_smiler.glb','assets/vendor/sketchfab_fps_arms.glb','assets/vendor/sketchfab_smiler_face.png','audio/smiler_sting.wav','audio/door_locked.wav','audio/door_creak.wav','audio/door_slam.wav','audio/flashlight_pickup.wav','audio/flashlight_click.wav','assets/vendor/flashlight_cc0.glb','assets/vendor/facility_corridor_cc0.glb','assets/vendor/scan_wheelchair_01.glb','assets/vendor/scan_barrel_02.glb','assets/vendor/scan_cardboard_box_01.glb','assets/vendor/scan_modular_airduct_circular_01.glb','assets/vendor/scan_industrial_wall_lamp.glb','assets/vendor/scan_gothicbed_01.glb','assets/vendor/scan_chandelier_03.glb','assets/vendor/scan_vintage_day_bed.glb','assets/vendor/scan_wooden_lantern_01.glb','assets/vendor/scan_bar_chair_round_01.glb','assets/vendor/scan_rubber_duck_toy.glb','assets/vendor/scan_painted_wooden_sofa.glb','assets/vendor/wakeup_wall_switch.glb','assets/vendor/wakeup_chair.glb','assets/vendor/frowner_online_ccby.png','assets/vendor/wakeup_wall.glb','assets/vendor/wakeup_floor_panel.glb','assets/vendor/wakeup_door_single_closed.glb','assets/vendor/wakeup_pipe.glb','assets/vendor/wakeup_computer_screen.glb','assets/vendor/fps_blaster_f.glb','assets/vendor/fps_wrad_arms.glb','assets/vendor/fps_wrad_grip_hands.glb','assets/vendor/fps_wrad_grip_r.glb','assets/vendor/fps_wrad_grip_l.glb','assets/vendor/fps_target_large.glb','assets/vendor/fps_clip_small.glb','assets/vendor/monster_step.ogg','assets/vendor/water.mp3','ASSET_CREDITS.md','OFL.txt','KOKORO_APACHE_2.txt','ui/game_icon.png','ui/team_logo.jpg']
          for f in required: assert (root/f).is_file() and (root/f).stat().st_size > 100, f
          level_source=Path('faceless2/backrooms_level.gd').read_text()
          player_source=Path('faceless2/backrooms_player.gd').read_text()
          for constructor in ('BoxMesh.new(', 'SphereMesh.new(', 'CylinderMesh.new(', 'ArrayMesh.new(', 'PlaneMesh.new(', 'CapsuleMesh.new('):
              assert constructor not in level_source and constructor not in player_source, 'Visible procedural geometry forbidden: '+constructor
          from fontTools.ttLib import TTFont
          cmap=TTFont(root/'assets/vendor/story_font.otf').getBestCmap()
          story=''.join(file.read_text() for file in Path('faceless2').glob('backrooms*.gd'))
          missing=sorted({c for c in story if 0x3400 <= ord(c) <= 0x9fff and ord(c) not in cmap})
          assert not missing, f'Chinese story font missing glyphs: {missing}'
          print('Build-time source asset inventory, all-GLB geometry and Chinese font: PASS')
          PYCODE
          for script in backrooms_extra_levels backrooms_extra_transport backrooms_fps_arena backrooms_fps backrooms_fps_checks backrooms_extra_levels_checks backrooms_rooms backrooms_level backrooms_story backrooms_prologue backrooms_prologue_room backrooms_wakeup_room backrooms_prologue_checks backrooms_player backrooms_ui backrooms_network backrooms_assets backrooms_story backrooms_checks backrooms_story_checks backrooms_cinematic_checks backrooms_network_checks backrooms_room_checks backrooms_fps_session_checks virtual_joystick touch_action; do
            godot --headless --path app --script "scripts/$script.gd" --check-only
          done
          timeout 180 godot --headless --path app --script scripts/backrooms_checks.gd 2>&1 | tee qa/runtime-checks.log
          timeout 180 godot --headless --path app --script scripts/backrooms_story_checks.gd 2>&1 | tee qa/story-checks.log
          timeout 180 godot --headless --path app --script scripts/backrooms_prologue_checks.gd 2>&1 | tee qa/prologue-checks.log
          timeout 180 godot --headless --path app --script scripts/backrooms_extra_levels_checks.gd 2>&1 | tee qa/extra-levels-checks.log
          timeout 180 godot --headless --path app --script scripts/backrooms_fps_checks.gd 2>&1 | tee qa/fps-checks.log
          timeout 180 godot --headless --verbose --path app --script scripts/backrooms_cinematic_checks.gd 2>&1 | tee qa/cinematic-checks.log
          python faceless2/test_backrooms_network.py --godot godot --project app --output qa 2>&1 | tee qa/network-checks.log
          python faceless2/test_room_directory.py --godot godot --project app --output qa 2>&1 | tee qa/room-directory.log
          python faceless2/test_fps_sessions.py --godot godot --project app --output qa 2>&1 | tee qa/fps-sessions.log
          python - <<'PYCODE'
          from pathlib import Path
          for name, marker in [("fps-sessions.log","FPS_REAL_MULTIPROCESS_UDP_PASS"),("runtime-checks.log","Faceless 2 runtime checks: PASS"),("network-checks.log","Faceless 2 P2P checks: PASS"),("story-checks.log","Faceless 2 story checks: PASS"),("prologue-checks.log","Faceless 2 prologue checks: PASS"),("cinematic-checks.log","Faceless 2 cinematic checks: PASS"),("extra-levels-checks.log","Faceless 2 extra levels checks: PASS"),("room-directory.log","Faceless 2 room directory: PASS")]:
              text=Path("qa",name).read_text()
              assert marker in text and "ERROR:" not in text and "FAIL" not in text, name
          PYCODE

      - name: Create debug keystore
        shell: bash
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000

      - name: Export Faceless 2 v0.31 APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p app/build
          godot --headless --path app --export-debug Android build/faceless2-v031-zorix.apk
          test -s app/build/faceless2-v031-zorix.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: faceless2-v031-zorix-apk
          path: app/build/faceless2-v031-zorix.apk
          if-no-files-found: error

      - name: Upload headless gameplay and P2P test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faceless2-v031-headless-qa
          path: qa
          if-no-files-found: error
