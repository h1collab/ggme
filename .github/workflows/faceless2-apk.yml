name: Build Backrooms Night Relay v12 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/faceless2-rendering-polish

concurrency:
  group: backrooms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified CC0 monster GLB
        shell: bash
        run: |
          # Stored as byte-range Git blobs to avoid per-request upload limits.
          # Concatenation reproduces the exact licensed FBX-converted GLB.
          cat faceless2/assets/entity.glb.part[0-9][0-9] > faceless2/assets/entity.glb
          echo "bf74395119a9c93aa13c46ec15d7facca2a314f9637e11de237a3bebb8ca9961  faceless2/assets/entity.glb" | sha256sum -c -
          test "$(git hash-object faceless2/assets/entity.glb)" = "f5e33713655ecc8e238451e556796a8791d73248"

      - name: Restore verified Godot base
        shell: bash
        run: |
          cat v03/chunk00.b64 v03/chunk01.b64 v03/chunk02.b64 v03/chunk03.b64 v03/chunk04.b64 v03/chunk05.b64 v03/chunk06.b64 > upgrade.b64
          base64 -d upgrade.b64 > upgrade.zip
          echo "054a7037bebddd6a4be9e697f495c5577756bc7b4c075681d2fb3226a74f65ea  upgrade.zip" | sha256sum -c -
          mkdir app
          unzip -q upgrade.zip -d app

      - name: Apply Backrooms story, external models and Android permissions
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0 fonttools==4.61.1
          python - <<'PYCODE'
          from pathlib import Path
          from PIL import Image
          import shutil, re
          for folder in ['scripts', 'assets', 'audio']:
              root=Path('app', folder)
              root.mkdir(parents=True, exist_ok=True)
              for item in root.iterdir():
                  if item.is_file(): item.unlink()
          source=Path('faceless2')
          for name in ['backrooms.gd','backrooms_level.gd','backrooms_player.gd','backrooms_ui.gd','backrooms_network.gd','backrooms_assets.gd','backrooms_story.gd','backrooms_story_checks.gd','backrooms_checks.gd','backrooms_network_checks.gd','virtual_joystick.gd','touch_action.gd']:
              shutil.copy2(source/name, Path('app/scripts')/name)
          shutil.copy2(source/'assets/entity.glb', 'app/assets/entity.glb')
          shutil.copy2(source/'ASSET_CREDITS.md', 'app/ASSET_CREDITS.md')
          shutil.copy2(source/'OFL.txt', 'app/OFL.txt')
          Path('app/main.tscn').write_text((source/'main.tscn').read_text().replace('res://faceless2/', 'res://scripts/'))
          shutil.copy2(source/'branding/game_icon.png', 'app/ui/game_icon.png')
          shutil.copy2(source/'branding/team_logo.jpg', 'app/ui/team_logo.jpg')
          Image.open('app/ui/team_logo.jpg').save('app/ui/team_splash.png')
          p=Path('app/project.godot'); s=p.read_text()
          s=re.sub(r'config/name=.*', 'config/name="Backrooms Night Relay"', s)
          s=re.sub(r'config/icon=.*', 'config/icon="res://ui/game_icon.png"', s)
          s=re.sub(r'boot_splash/image=.*', 'boot_splash/image="res://ui/team_splash.png"', s)
          s=re.sub(r'boot_splash/bg_color=.*', 'boot_splash/bg_color=Color(1, 1, 1, 1)', s)
          s=s.replace('boot_splash/fullsize=false','boot_splash/fullsize=true')
          # Keep Vulkan; avoid Godot 4.7's Swappy presentation hang (#121035).
          s=s.replace('[display]', '[display]\nwindow/frame_pacing/android/enable_frame_pacing=false', 1)
          s=re.sub(r'(?m)^worker_pool/(max_threads|low_priority_thread_ratio)=.*\n?', '', s)
          if '[threading]' not in s: s += '\n[threading]\n'
          s=s.replace('[threading]', '[threading]\nworker_pool/max_threads=8\nworker_pool/low_priority_thread_ratio=1.0', 1)
          p.write_text(s)
          p=Path('app/export_presets.cfg'); s=p.read_text()
          s=s.replace('Escape Black Pine','Backrooms Night Relay').replace('School Brawl','Backrooms Night Relay')
          s=s.replace('res://ui/icon.svg','res://ui/game_icon.png')
          s=re.sub(r'(?m)^version/code=.*','version/code=12',s)
          s=re.sub(r'(?m)^version/name=.*','version/name="0.12.0"',s)
          # Export all resources: scripts load imported GLBs, audio and textures by path.
          # A resource-only selection is unsafe for dynamic ResourceLoader paths.
          s=re.sub(r'(?m)^export_filter=.*', 'export_filter="all_resources"', s)
          s=re.sub(r'(?m)^include_filter=.*', 'include_filter="ASSET_CREDITS.md,OFL.txt"', s)
          s=re.sub(r'(?m)^exclude_filter=.*', 'exclude_filter=""', s)
          for setting in ['launcher_icons/main_192x192','launcher_icons/adaptive_foreground_432x432','launcher_icons/adaptive_background_432x432','splash_screen/icon']:
              s=re.sub(r'(?m)^'+re.escape(setting)+r'=.*', setting+'="res://ui/game_icon.png"', s)
          for architecture in ['arm64-v8a','x86_64']:
              s=re.sub(r'(?m)^architectures/'+architecture+'=.*', 'architectures/'+architecture+'=true', s)
          for name in ['internet','access_network_state']:
              field='permissions/'+name
              if re.search(r'(?m)^'+field+'=',s): s=re.sub(r'(?m)^'+field+'=.*', field+'=true',s)
              else: s += '\n'+field+'=true\n'
          p.write_text(s)
          PYCODE
          python faceless2/backrooms_audio.py app/audio
          python faceless2/fetch_backrooms_assets.py app/assets/vendor
          mkdir -p qa

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS

      - name: Import and test real gameplay and P2P sessions
        shell: bash
        run: |
          godot --headless --path app --import
          python - <<'PYCODE'
          from pathlib import Path
          root=Path('app')
          required=['assets/entity.glb','assets/vendor/story_font.otf','assets/vendor/crew.glb','assets/vendor/monster_step.ogg','assets/vendor/water.mp3','ASSET_CREDITS.md','OFL.txt','ui/game_icon.png','ui/team_logo.jpg']
          for f in required: assert (root/f).is_file() and (root/f).stat().st_size > 100, f
          print('Build-time source asset inventory: PASS')
          PYCODE
          for script in backrooms backrooms_level backrooms_player backrooms_ui backrooms_network backrooms_assets backrooms_story virtual_joystick touch_action; do
            godot --headless --path app --script "scripts/$script.gd" --check-only
          done
          timeout 180 godot --headless --path app --script scripts/backrooms_checks.gd 2>&1 | tee qa/runtime-checks.log
          timeout 180 godot --headless --path app --script scripts/backrooms_story_checks.gd 2>&1 | tee qa/story-checks.log
          python faceless2/test_backrooms_network.py --godot godot --project app --output qa 2>&1 | tee qa/network-checks.log
          python - <<'PYCODE'
          from pathlib import Path
          for name, marker in [("runtime-checks.log","Backrooms runtime checks: PASS"),("network-checks.log","Backrooms P2P checks: PASS"),("story-checks.log","Backrooms story checks: PASS")]:
              text=Path("qa",name).read_text()
              assert marker in text and "ERROR:" not in text and "FAIL" not in text, name
          PYCODE

      - name: Create debug keystore
        shell: bash
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000

      - name: Export Backrooms v12 APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p app/build
          godot --headless --path app --export-debug Android build/backrooms-v12-zorix.apk
          test -s app/build/backrooms-v12-zorix.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-v12-zorix-apk
          path: app/build/backrooms-v12-zorix.apk
          if-no-files-found: error

      - name: Upload headless gameplay and P2P test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-v12-headless-qa
          path: qa
          if-no-files-found: error
