name: Build Backrooms Night Relay v11 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - fix/faceless2-rendering-polish

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified Godot base
        shell: bash
        run: |
          cat v03/chunk00.b64 v03/chunk01.b64 v03/chunk02.b64 v03/chunk03.b64 v03/chunk04.b64 v03/chunk05.b64 v03/chunk06.b64 > upgrade.b64
          base64 -d upgrade.b64 > upgrade.zip
          echo "054a7037bebddd6a4be9e697f495c5577756bc7b4c075681d2fb3226a74f65ea  upgrade.zip" | sha256sum -c -
          mkdir app
          unzip -q upgrade.zip -d app

      - name: Apply monster-free Backrooms project and Android permissions
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          python - <<'PYCODE'
          from pathlib import Path
          from PIL import Image
          import shutil, re
          for folder in ['scripts', 'assets', 'audio']:
              root=Path('app', folder)
              root.mkdir(parents=True, exist_ok=True)
              for item in root.iterdir():
                  if item.is_file(): item.unlink()
          source=Path('faceless2')
          for name in ['backrooms.gd','backrooms_level.gd','backrooms_player.gd','backrooms_ui.gd','backrooms_network.gd','backrooms_checks.gd','backrooms_network_checks.gd','backrooms_visual_checks.gd','virtual_joystick.gd','touch_action.gd']:
              shutil.copy2(source/name, Path('app/scripts')/name)
          shutil.copy2(source/'main.tscn', 'app/main.tscn')
          shutil.copy2(source/'branding/game_icon.png', 'app/ui/game_icon.png')
          shutil.copy2(source/'branding/team_logo.jpg', 'app/ui/team_logo.jpg')
          Image.open('app/ui/team_logo.jpg').save('app/ui/team_splash.png')
          p=Path('app/project.godot'); s=p.read_text()
          s=re.sub(r'config/name=.*', 'config/name="Backrooms Night Relay"', s)
          s=re.sub(r'config/icon=.*', 'config/icon="res://ui/game_icon.png"', s)
          s=re.sub(r'boot_splash/image=.*', 'boot_splash/image="res://ui/team_splash.png"', s)
          s=re.sub(r'boot_splash/bg_color=.*', 'boot_splash/bg_color=Color(1, 1, 1, 1)', s)
          s=s.replace('boot_splash/fullsize=false','boot_splash/fullsize=true')
          s=re.sub(r'(?m)^worker_pool/(max_threads|low_priority_thread_ratio)=.*\n?', '', s)
          if '[threading]' not in s: s += '\n[threading]\n'
          s=s.replace('[threading]', '[threading]\nworker_pool/max_threads=8\nworker_pool/low_priority_thread_ratio=1.0', 1)
          p.write_text(s)
          p=Path('app/export_presets.cfg'); s=p.read_text()
          s=s.replace('Escape Black Pine','Backrooms Night Relay').replace('School Brawl','Backrooms Night Relay')
          s=s.replace('res://ui/icon.svg','res://ui/game_icon.png')
          s=re.sub(r'(?m)^version/code=.*','version/code=11',s)
          s=re.sub(r'(?m)^version/name=.*','version/name="0.11.0"',s)
          for architecture in ['arm64-v8a','x86_64']:
              s=re.sub(r'(?m)^architectures/'+architecture+'=.*', 'architectures/'+architecture+'=true', s)
          for name in ['internet','access_network_state']:
              field='permissions/'+name
              if re.search(r'(?m)^'+field+'=',s): s=re.sub(r'(?m)^'+field+'=.*', field+'=true',s)
              else: s += '\n'+field+'=true\n'
          p.write_text(s)
          PYCODE
          python faceless2/backrooms_audio.py app/audio
          mkdir -p qa

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS

      - name: Import and test real gameplay and P2P sessions
        shell: bash
        run: |
          godot --headless --path app --import
          for script in backrooms backrooms_level backrooms_player backrooms_ui backrooms_network virtual_joystick touch_action; do
            godot --headless --path app --script "scripts/$script.gd" --check-only
          done
          timeout 180 godot --headless --path app --script scripts/backrooms_checks.gd 2>&1 | tee qa/runtime-checks.log
          python faceless2/test_backrooms_network.py --godot godot --project app --output qa 2>&1 | tee qa/network-checks.log
          python - <<'PYCODE'
          from pathlib import Path
          for name, marker in [("runtime-checks.log","Backrooms runtime checks: PASS"),("network-checks.log","Backrooms P2P checks: PASS")]:
              text=Path("qa",name).read_text()
              assert marker in text and "ERROR:" not in text and "FAIL" not in text, name
          PYCODE

      - name: Capture actual Mobile Vulkan gameplay views
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers
          # Match the exact software Vulkan driver used for local visual QA.
          curl -L --fail --retry 4 -o qa-mesa.deb "https://archive.ubuntu.com/ubuntu/pool/main/m/mesa/mesa-vulkan-drivers_25.2.8-0ubuntu0.24.04.2_amd64.deb"
          echo "b3be471db0ec27eb28c1ea75a4d2e6bb3207c5904bdc3823dbba9ce530026939  qa-mesa.deb" | sha256sum -c -
          dpkg-deb -x qa-mesa.deb /tmp/qa-mesa
          python - <<'PYCODE'
          import json
          from pathlib import Path
          descriptor={"ICD":{"api_version":"1.4.318","library_path":"/tmp/qa-mesa/usr/lib/x86_64-linux-gnu/libvulkan_lvp.so"},"file_format_version":"1.0.1"}
          Path("/tmp/qa-lvp.json").write_text(json.dumps(descriptor))
          PYCODE
          VK_DRIVER_FILES=/tmp/qa-lvp.json LP_NUM_THREADS=2 timeout 720 xvfb-run -a godot --path app --audio-driver Dummy --rendering-method mobile --resolution 1280x720 --script scripts/backrooms_visual_checks.gd -- --output="$GITHUB_WORKSPACE/qa" 2>&1 | tee qa/visual-checks.log
          test "$(find qa -name '*.png' | wc -l)" -eq 18
          python - <<'PYCODE'
          from pathlib import Path
          for name, marker in [("runtime-checks.log","Backrooms runtime checks: PASS"),("network-checks.log","Backrooms P2P checks: PASS"),("visual-checks.log","Backrooms visual captures: PASS")]:
              text=Path("qa",name).read_text()
              assert marker in text and "ERROR:" not in text and "FAIL" not in text, name
          print("All required runtime checks completed without engine errors")
          PYCODE

      - name: Create debug keystore
        shell: bash
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000

      - name: Export Backrooms v11 APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p app/build
          godot --headless --path app --export-debug Android build/backrooms-v11-zorix.apk
          test -s app/build/backrooms-v11-zorix.apk

      - name: Verify APK signature, package and networking permission
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose app/build/backrooms-v11-zorix.apk | tee qa/apk-signature.log
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print app/build/backrooms-v11-zorix.apk > qa/android-manifest.xml
          python - <<'PYCODE'
          from pathlib import Path
          import zipfile, xml.etree.ElementTree as ET
          text=Path('qa/android-manifest.xml').read_text()
          manifest=ET.fromstring(text)
          ns='{http://schemas.android.com/apk/res/android}'
          assert 'android.permission.INTERNET' in text
          assert manifest.get(ns+'versionCode') == '11'
          with zipfile.ZipFile('app/build/backrooms-v11-zorix.apk') as z:
              names=z.namelist()
              assert any(n.startswith('lib/arm64-v8a/') for n in names)
              assert any(n.startswith('lib/x86_64/') for n in names)
              assert any('backrooms.gdc' in n or 'backrooms.gd' in n for n in names)
              assert not any(n.startswith('assets/scripts/') and ('faceless.gd' in n or 'soldier.gd' in n or 'game.gd' in n) for n in names)
              assert not any('voice_intro_' in n or n.endswith('.glb') for n in names)
          PYCODE

      - name: Enable emulator hardware acceleration
        shell: bash
        run: |
          test -c /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Install and play the actual APK on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: python faceless2/test_backrooms_android.py --godot godot --project app --apk app/build/backrooms-v11-zorix.apk --output qa

      - name: Upload APK
        if: always() && hashFiles('app/build/backrooms-v11-zorix.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-v11-zorix-apk
          path: app/build/backrooms-v11-zorix.apk
          if-no-files-found: error

      - name: Upload model report and rendered test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-v11-visual-qa
          path: qa
          if-no-files-found: error
