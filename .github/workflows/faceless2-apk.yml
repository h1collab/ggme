name: Build Faceless 2 v6 Expanded APK

on:
  workflow_dispatch:
  push:
    branches:
      - faceless-2-v6-expanded
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: Restore verified Godot base
        shell: bash
        run: |
          cat v03/chunk00.b64 v03/chunk01.b64 v03/chunk02.b64 v03/chunk03.b64 v03/chunk04.b64 v03/chunk05.b64 v03/chunk06.b64 > upgrade.b64
          base64 -d upgrade.b64 > upgrade.zip
          echo "054a7037bebddd6a4be9e697f495c5577756bc7b4c075681d2fb3226a74f65ea  upgrade.zip" | sha256sum -c -
          mkdir app
          unzip -q upgrade.zip -d app

      - name: Apply Faceless 2 v4 project
        shell: bash
        run: |
          cp faceless2/game.gd app/scripts/game.gd
          cp faceless2/player.gd app/scripts/player.gd
          cp faceless2/faceless.gd app/scripts/faceless.gd
          cp faceless2/soldier.gd app/scripts/soldier.gd
          cp faceless2/virtual_joystick.gd app/scripts/virtual_joystick.gd
          cp faceless2/main.tscn app/main.tscn
          cp faceless2/icon.svg app/ui/icon.svg
          sed -i 's/Escape Black Pine/Faceless 2/g' app/project.godot
          sed -i 's/School Brawl/Faceless 2/g' app/project.godot
          sed -i 's/Escape Black Pine/Faceless 2/g' app/export_presets.cfg
          sed -i 's/School Brawl/Faceless 2/g' app/export_presets.cfg
          sed -i 's/escape-black-pine-zorix-v03.apk/faceless-2-v6-zorix.apk/g' app/export_presets.cfg
          rm -f app/assets/*.glb
          test -s app/scripts/game.gd
          test -s app/main.tscn

      - name: Verify Sketchfab authentication
        shell: bash
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
        run: |
          if [ -z "$SKETCHFAB_TOKEN" ]; then
            echo "::error::Missing SKETCHFAB_TOKEN repository secret. Faceless 2 v4 intentionally refuses to fall back to generated GLBs."
            exit 1
          fi

      - name: Download original Sketchfab GLBs
        shell: bash
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
        run: |
          python faceless2/fetch_sketchfab_assets.py app/assets
          cp app/assets/SKETCHFAB_CREDITS.txt app/SKETCHFAB_CREDITS.txt
          python - <<'PY'
          import json, os
          m=json.load(open("faceless2/sketchfab_assets.json",encoding="utf-8"))
          for a in m["assets"]:
              p=os.path.join("app","assets",a["output"])
              assert os.path.isfile(p) and os.path.getsize(p)>1024, p
          print("verified", len(m["assets"]), "Sketchfab GLBs")
          PY

      - name: Generate offline cinematic TTS voice files
        shell: bash
        run: |
          mkdir -p app/audio
          curl -L --retry 4 -o piper.tar.gz "https://github.com/rhasspy/piper/releases/download/v1.2.0/piper_amd64.tar.gz"
          tar -xzf piper.tar.gz
          curl -L --retry 4 -o voice.onnx "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/hfc_male/medium/en_US-hfc_male-medium.onnx"
          curl -L --retry 4 -o voice.onnx.json "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/hfc_male/medium/en_US-hfc_male-medium.onnx.json"
          printf '%s\n' "Blackwood Control to field unit. The checkpoint powered itself back on at zero two thirteen. No utility crew is present. Proceed to Relay One and restore the grid." | ./piper/piper --model voice.onnx --output_file app/audio/voice_intro_01.wav
          printf '%s\n' "Patrol Twelve stopped responding forty eight hours ago. Armed security now holds the road. They will fire on sight." | ./piper/piper --model voice.onnx --output_file app/audio/voice_intro_02.wav
          printf '%s\n' "One impossible frame survived. A man without a face appears behind every lost patrol. Gunfire only delays it." | ./piper/piper --model voice.onnx --output_file app/audio/voice_intro_03.wav
          printf '%s\n' "Restore all three relays. Recover the evidence. Find the rifle at the ranger cabin. Then reach the dead zone gate alive." | ./piper/piper --model voice.onnx --output_file app/audio/voice_intro_04.wav
          printf '%s\n' "First objective. Follow the road to Relay One. Interact with the electrical cabinet when you reach it." | ./piper/piper --model voice.onnx --output_file app/audio/voice_objective_01.wav
          printf '%s\n' "Security reinforcements are moving toward the abandoned stop. Stay off the centerline." | ./piper/piper --model voice.onnx --output_file app/audio/voice_relay_01.wav
          printf '%s\n' "Relay Two exposed your position. Reach the ranger cabin and recover the rifle before the next team arrives." | ./piper/piper --model voice.onnx --output_file app/audio/voice_relay_02.wav
          printf '%s\n' "All relays are online. Move to the dead zone gate. Expect one final response." | ./piper/piper --model voice.onnx --output_file app/audio/voice_relay_03.wav
          printf '%s\n' "Movement confirmed around the surveillance tower. Armed personnel are searching the road ahead." | ./piper/piper --model voice.onnx --output_file app/audio/voice_chapter_02.wav
          printf '%s\n' "The ranger cabin is close. Recover the rifle and resupply before continuing." | ./piper/piper --model voice.onnx --output_file app/audio/voice_chapter_03.wav
          printf '%s\n' "All three relays are synchronized. The Faceless signal is now moving with you instead of behind you." | ./piper/piper --model voice.onnx --output_file app/audio/voice_chapter_04.wav
          printf '%s\n' "The gate is powered, but a security counterattack is inbound. Hold the dead zone until the road is clear." | ./piper/piper --model voice.onnx --output_file app/audio/voice_final_wave.wav
          printf '%s\n' "Counterattack neutralized. The dead zone gate is clear. Extract now." | ./piper/piper --model voice.onnx --output_file app/audio/voice_final_clear.wav
          test -s app/audio/voice_intro_01.wav
          test -s app/audio/voice_intro_02.wav
          test -s app/audio/voice_intro_03.wav
          test -s app/audio/voice_intro_04.wav
          test -s app/audio/voice_objective_01.wav
          test -s app/audio/voice_relay_01.wav
          test -s app/audio/voice_relay_02.wav
          test -s app/audio/voice_relay_03.wav
          test -s app/audio/voice_chapter_02.wav
          test -s app/audio/voice_chapter_03.wav
          test -s app/audio/voice_chapter_04.wav
          test -s app/audio/voice_final_wave.wav
          test -s app/audio/voice_final_clear.wav

      - name: Generate audio and Android icon
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python faceless2/generate_audio.py app/audio
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url="app/ui/icon.svg", write_to="app/ui/icon.png", output_width=512, output_height=512)
          PY
          sed -i 's#boot_splash/image="res://ui/icon.svg"#boot_splash/image="res://ui/icon.png"#' app/project.godot
          sed -i 's#config/icon="res://ui/icon.svg"#config/icon="res://ui/icon.png"#' app/project.godot
          sed -i 's#res://ui/icon.svg#res://ui/icon.png#g' app/export_presets.cfg
          test -s app/audio/blackwood_ambience.wav
          test -s app/audio/signal_static.wav
          test -s app/audio/chase_pulse.wav
          test -s app/audio/pistol_shot.wav
          test -s app/audio/rifle_shot.wav
          test -s app/audio/reload_click.wav
          test -s app/audio/footstep.wav
          test -s app/audio/footstep_run.wav
          test -s app/audio/heartbeat.wav
          test -s app/ui/icon.png

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS

      - name: Headless import and GDScript validation
        shell: bash
        run: |
          godot --headless --path app --import
          godot --headless --path app --script scripts/virtual_joystick.gd --check-only
          godot --headless --path app --script scripts/player.gd --check-only
          godot --headless --path app --script scripts/faceless.gd --check-only
          godot --headless --path app --script scripts/soldier.gd --check-only
          godot --headless --path app --script scripts/game.gd --check-only

      - name: Create debug keystore
        shell: bash
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000

      - name: Export Faceless 2 v6 APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p app/build
          godot --headless --path app --export-debug Android build/faceless-2-v6-zorix.apk
          test -s app/build/faceless-2-v6-zorix.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: faceless-2-v6-zorix-apk
          path: app/build/faceless-2-v6-zorix.apk
          if-no-files-found: error
