name: Zorix School Brawl Sketchfab Rebuild APK

on:
  workflow_dispatch:
  push:
    branches:
      - school-brawl-sketchfab

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Restore verified Godot base
        shell: bash
        run: |
          cat v03/chunk00.b64 v03/chunk01.b64 v03/chunk02.b64 v03/chunk03.b64 v03/chunk04.b64 v03/chunk05.b64 v03/chunk06.b64 > upgrade.b64
          base64 -d upgrade.b64 > upgrade.zip
          echo "054a7037bebddd6a4be9e697f495c5577756bc7b4c075681d2fb3226a74f65ea  upgrade.zip" | sha256sum -c -
          mkdir app
          unzip -q upgrade.zip -d app

      - name: Apply School Brawl gameplay
        shell: bash
        run: |
          cp combat/game.gd app/scripts/game.gd
          cp combat/player.gd app/scripts/player.gd
          cp combat/stalker.gd app/scripts/stalker.gd
          cp combat/virtual_joystick.gd app/scripts/virtual_joystick.gd
          sed -i 's/Escape Black Pine/School Brawl/g' app/project.godot
          sed -i 's/Escape Black Pine/School Brawl/g' app/export_presets.cfg
          sed -i 's/escape-black-pine-zorix-v03.apk/school-brawl-zorix.apk/g' app/export_presets.cfg
          test -s app/scripts/game.gd
          test -s app/scripts/player.gd
          test -s app/scripts/stalker.gd

      - name: Generate reconstructed Sketchfab-reference GLB assets and Android icon
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check trimesh numpy cairosvg
          python app/tools/generate_assets.py
          base64 -d tools/generate_sketchfab_rebuild.py.gz.b64 | gzip -d > /tmp/generate_sketchfab_rebuild.py
          python /tmp/generate_sketchfab_rebuild.py app/assets
          python tools/generate_school_shell.py app/assets
          python - <<'PY'
          import cairosvg
          cairosvg.svg2png(url="app/ui/icon.svg", write_to="app/ui/icon.png", output_width=512, output_height=512)
          PY
          sed -i 's#boot_splash/image="res://ui/icon.svg"#boot_splash/image="res://ui/icon.png"#' app/project.godot
          sed -i 's#config/icon="res://ui/icon.svg"#config/icon="res://ui/icon.png"#' app/project.godot
          sed -i 's#res://ui/icon.svg#res://ui/icon.png#g' app/export_presets.cfg
          test -s app/ui/icon.png
          for f in             teacher_sketchfab_rebuild.glb             student_desk_sketchfab_rebuild.glb             teacher_desk_sketchfab_rebuild.glb             lockers_sketchfab_rebuild.glb             blackboard_sketchfab_rebuild.glb             classroom_door_sketchfab_rebuild.glb             school_window_sketchfab_rebuild.glb             fluorescent_light_sketchfab_rebuild.glb             school_backpack_sketchfab_rebuild.glb             book_stack_sketchfab_rebuild.glb             trash_can_sketchfab_rebuild.glb             classroom_cabinet_sketchfab_rebuild.glb             wall_clock_sketchfab_rebuild.glb             classroom_shell_sketchfab_rebuild.glb; do
            test -s "app/assets/$f"
          done

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.1" "platforms;android-35" "cmdline-tools;latest" "cmake;3.10.2.4988404" "ndk;28.1.13356709"

      - name: Install Godot 4.7.2
        shell: bash
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          curl -L -o templates.tpz "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz"
          mkdir -p /tmp/godot-templates "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          unzip -q templates.tpz -d /tmp/godot-templates
          cp -r /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.7.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          SETTINGS

      - name: Headless import and GDScript validation
        shell: bash
        run: |
          godot --headless --path app --import
          godot --headless --path app --script scripts/virtual_joystick.gd --check-only
          godot --headless --path app --script scripts/player.gd --check-only
          godot --headless --path app --script scripts/stalker.gd --check-only
          godot --headless --path app --script scripts/game.gd --check-only

      - name: Create debug keystore
        shell: bash
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore "$GITHUB_WORKSPACE/debug.keystore" -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 10000

      - name: Export School Brawl APK
        shell: bash
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p app/build
          godot --headless --path app --export-debug Android build/school-brawl-zorix-sketchfab.apk
          test -s app/build/school-brawl-zorix-sketchfab.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: school-brawl-zorix-sketchfab-apk
          path: app/build/school-brawl-zorix-sketchfab.apk
          if-no-files-found: error
