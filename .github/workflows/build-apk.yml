name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild source archive
        shell: bash
        run: |
          cat payload/chunk*.b64 > source.zip.b64
          base64 -d source.zip.b64 > source.zip
          echo "7fd9187029f38ccd790f73e5bc2a055cd0023c5cc7fb0220b3bd3530c7db70bf  source.zip" | sha256sum -c -
          mkdir src
          unzip -q source.zip -d src

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android toolchain
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;30.0.16248370" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        working-directory: src
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: escape-school-debug-apk
          path: src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
